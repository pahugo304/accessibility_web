<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Mon Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Skip to main content link */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #000;
            color: white;
            padding: 8px;
            text-decoration: none;
            z-index: 100;
        }
        .skip-link:focus {
            top: 0;
        }
        
        /* Wrapper pour le champ mot de passe avec bouton */
        .password-wrapper {
            position: relative;
        }
        
        /* Bouton toggle mot de passe (œil) */
        .password-toggle {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            border-radius: 4px;
            transition: all 0.2s;
        }
        
        .password-toggle:hover {
            color: #374151;
            background-color: #f3f4f6;
        }
        
        .password-toggle:focus {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
            color: #3b82f6;
        }
        
        /* Espace pour le bouton dans l'input */
        .password-wrapper input {
            padding-right: 45px;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Skip to main content for keyboard navigation -->
    <a href="#main-content" class="skip-link">Aller au contenu principal</a>

    <div class="min-h-screen flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-lg shadow-md">
            <!-- Logo/Header -->
            <div class="text-center">
                <div class="mx-auto h-24 w-24 bg-gray-200 rounded-lg flex items-center justify-center" role="img" aria-label="Logo Mon Blog">
                    <svg class="h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                </div>
                <h1 class="mt-6 text-3xl font-bold text-gray-900">Mon Blog</h1>
                <p class="mt-2 text-sm text-gray-600">Connectez-vous à votre compte</p>
            </div>

            <!-- Login Form -->
            <main id="main-content">
                <form class="mt-8 space-y-6" action="index.html" method="get" aria-labelledby="form-title">
                    <h2 id="form-title" class="sr-only">Formulaire de connexion</h2>
                    
                    <div class="space-y-4">
                        <!-- Email field -->
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                                Adresse email
                            </label>
                            <input 
                                id="email" 
                                name="email" 
                                type="email" 
                                autocomplete="email" 
                                required 
                                class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
                                placeholder="votre@email.com"
                                aria-required="true"
                                aria-describedby="email-description"
                            >
                            <p id="email-description" class="sr-only">Entrez votre adresse email pour vous connecter</p>
                        </div>

                        <!-- Password field avec bouton œil -->
                        <div>
                            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                                Mot de passe
                            </label>
                            <div class="password-wrapper">
                                <input 
                                    id="password" 
                                    name="password" 
                                    type="password" 
                                    autocomplete="current-password" 
                                    required 
                                    class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
                                    placeholder="Mot de passe"
                                    aria-required="true"
                                    aria-describedby="password-description"
                                >
                                <button 
                                    type="button" 
                                    class="password-toggle" 
                                    aria-label="Afficher le mot de passe"
                                    aria-pressed="false"
                                    onclick="togglePassword()"
                                >
                                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                        <!-- Œil ouvert (visible par défaut) -->
                                        <path class="eye-open" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                        <path class="eye-open" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                        <!-- Œil barré (caché par défaut) -->
                                        <line class="eye-closed" x1="3" y1="3" x2="21" y2="21" stroke-linecap="round" stroke-width="2" style="display: none;" />
                                        <path class="eye-closed" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.5 10.677a2 2 0 002.823 2.823M7.362 7.561A8.963 8.963 0 0112 6.25c4.478 0 8.268 2.194 9.542 5.25a9.99 9.99 0 01-2.134 3.139M3.458 12.75c1.274-3.056 5.065-5.25 9.542-5.25.838 0 1.653.101 2.435.287" style="display: none;" />
                                    </svg>
                                </button>
                            </div>
                            <p id="password-description" class="sr-only">Entrez votre mot de passe</p>
                        </div>
                    </div>

                    <!-- Remember me & Forgot password -->
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input 
                                id="remember-me" 
                                name="remember-me" 
                                type="checkbox" 
                                class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                                aria-describedby="remember-description"
                            >
                            <label for="remember-me" class="ml-2 block text-sm text-gray-900">
                                Se souvenir de moi
                            </label>
                            <p id="remember-description" class="sr-only">Cochez cette case pour rester connecté</p>
                        </div>

                        <div class="text-sm">
                            <a href="#" class="font-medium text-blue-600 hover:text-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 rounded">
                                Mot de passe oublié ?
                            </a>
                        </div>
                    </div>

                    <!-- Submit button -->
                    <div>
                        <button 
                            type="submit" 
                            class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors"
                            aria-label="Se connecter au blog"
                        >
                            Se connecter
                        </button>
                    </div>

                    <!-- Register link -->
                    <div class="text-center">
                        <p class="text-sm text-gray-600">
                            Pas encore de compte ?
                            <a href="#" class="font-medium text-blue-600 hover:text-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 rounded">
                                Créer un compte
                            </a>
                        </p>
                    </div>
                </form>
            </main>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleButton = document.querySelector('.password-toggle');
            const eyeOpen = document.querySelectorAll('.eye-open');
            const eyeClosed = document.querySelectorAll('.eye-closed');
            
            if (passwordInput.type === 'password') {
                // Afficher le mot de passe
                passwordInput.type = 'text';
                toggleButton.setAttribute('aria-label', 'Masquer le mot de passe');
                toggleButton.setAttribute('aria-pressed', 'true');
                
                // Changer l'icône : cacher l'œil ouvert, montrer l'œil barré
                eyeOpen.forEach(path => path.style.display = 'none');
                eyeClosed.forEach(path => path.style.display = 'block');
            } else {
                // Masquer le mot de passe
                passwordInput.type = 'password';
                toggleButton.setAttribute('aria-label', 'Afficher le mot de passe');
                toggleButton.setAttribute('aria-pressed', 'false');
                
                // Changer l'icône : montrer l'œil ouvert, cacher l'œil barré
                eyeOpen.forEach(path => path.style.display = 'block');
                eyeClosed.forEach(path => path.style.display = 'none');
            }
        }
    </script>
</body>
</html>
